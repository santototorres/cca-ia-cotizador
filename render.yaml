services:
  - type: web
    name: cca-ia-cotizador
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: "CCA IA Cotizador"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://cca-ia-cotizador.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: cca-ia-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_FROM_ADDRESS
        value: cotizador@ccargo.co
      - key: MAIL_FROM_NAME
        value: "CCA IA Cotizador"
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_STORE
        value: array
      - key: QUEUE_CONNECTION
        value: sync

databases:
  - name: cca-ia-db
    plan: free
    databaseName: cca_cotizador
    user: cca_user
